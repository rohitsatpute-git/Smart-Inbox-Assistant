spring.application.name=smart-inbox
server.port=8080

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:smartinbox}
spring.datasource.password=${ORACLE_PASSWORD:smartinbox}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

inbox.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}
inbox.attachment-dir=${ATTACHMENT_DIR:../data/attachments}
inbox.testdata-dir=${TESTDATA_DIR:../testdata}
inbox.reviewer-user=${REVIEWER_USER:reviewer}
inbox.reviewer-password=${REVIEWER_PASSWORD:reviewer123}

inbox.imap.enabled=${IMAP_ENABLED:true}
inbox.imap.host=${IMAP_HOST:imap.gmail.com}
inbox.imap.port=${IMAP_PORT:993}
inbox.imap.user=${GMAIL_USER:}
inbox.imap.password=${GMAIL_APP_PASSWORD:}
inbox.imap.poll-ms=${IMAP_POLL_MS:30000}

logging.level.com.clinevo.smartinbox=INFO
